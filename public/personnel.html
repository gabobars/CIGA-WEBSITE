<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CIGA SYSTEMS // PERSONNEL</title>

    <link
        rel="icon"
        type="image/png"
        href="logo.png"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            background: #000;
            color: #fff;

            min-height: 100vh;

            font-family:
                "OCR A",
                "Courier New",
                monospace;
        }


        .page {
            min-height: 100vh;

            padding:
                40px 55px;

            opacity: 0;

            animation:
                pageIn 1s ease forwards;
        }


        @keyframes pageIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-end;

            padding-bottom: 15px;

            margin-bottom: 30px;

            border-bottom:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.30
                );
        }


        .title {
            font-size: 22px;

            letter-spacing: 4px;

            color: #fff;

            text-decoration: none;

            cursor: pointer;
        }


        .title:hover {
            text-decoration: none;

            text-shadow:
                0 0 6px rgba(255,255,255,0.8),
                0 0 15px rgba(255,255,255,0.35);
        }


        .subtitle {
            margin-top: 7px;

            font-size: 11px;

            letter-spacing: 2px;

            opacity: 0.55;
        }


        .status {
            text-align: right;

            font-size: 10px;

            line-height: 1.8;

            letter-spacing: 1px;

            opacity: 0.65;
        }


        /* =========================
           BOOT TEXT
        ========================= */

        .terminal {
            margin-bottom: 35px;

            font-size: 12px;

            line-height: 1.9;

            letter-spacing: 1px;

            opacity: 0.75;
        }


        .terminal span {
            opacity: 0.42;
        }


        /* =========================
           DIRECTORY
        ========================= */

        .directory {
            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );

            padding: 25px;
        }


        .directory-title {
            font-size: 11px;

            letter-spacing: 3px;

            opacity: 0.58;

            padding-bottom: 12px;

            margin-bottom: 20px;

            border-bottom:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );
        }


        /* =========================
           FILE CARD
        ========================= */

        .file-link {
            display: block;

            color: inherit;

            text-decoration: none;
        }


        .file {
            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.20
                );

            padding: 20px;

            display: grid;

            grid-template-columns:
                1fr
                auto
                80px;

            gap: 20px;

            margin-bottom: 10px;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                transform 0.25s ease;

            cursor: pointer;
        }


        .file-link:hover .file {
            background:
                rgba(
                    255,
                    255,
                    255,
                    0.04
                );

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    0.55
                );

            transform:
                translateX(4px);
        }


        .file-id {
            font-size: 11px;

            letter-spacing: 2px;

            opacity: 0.45;

            margin-bottom: 10px;
        }


        .file-subject {
            font-size: 17px;

            letter-spacing: 2px;

            margin-bottom: 12px;
        }


        .file-meta {
            font-size: 11px;

            line-height: 1.8;

            letter-spacing: 1px;

            opacity: 0.63;
        }


        .file-status {
            display: flex;

            align-items: center;

            font-size: 10px;

            letter-spacing: 2px;

            opacity: 0.65;
        }


        .file-status::before {
            content: "";

            width: 6px;

            height: 6px;

            margin-right: 8px;

            background: #fff;

            border-radius: 50%;

            box-shadow:
                0 0 8px
                rgba(
                    255,
                    255,
                    255,
                    0.7
                );
        }


        /* =========================
           FILE PHOTO
        ========================= */

        .file-photo {
            width: 70px;

            height: 85px;

            object-fit: cover;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.3
                );

            background: #080808;

            filter:
                grayscale(100%);

            font-size: 9px;

            line-height: 1.4;

            letter-spacing: 1px;

            text-align: center;

            opacity: 0.88;
        }


        /* =========================
           LOADING / ERROR
        ========================= */

        .database-message {
            padding: 20px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            font-size: 11px;

            line-height: 1.8;

            letter-spacing: 2px;

            opacity: 0.62;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            display: flex;

            justify-content:
                space-between;

            margin-top: 30px;

            padding-top: 14px;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.2
                );

            font-size: 9px;

            letter-spacing: 2px;

            opacity: 0.40;
        }


        /* =========================
           BACK
        ========================= */

        .back {
            display: inline-block;

            margin-top: 25px;

            color: #fff;

            text-decoration: none;

            font-family: inherit;

            font-size: 10px;

            letter-spacing: 2px;

            opacity: 0.52;

            transition:
                opacity 0.2s ease;
        }


        .back:hover {
            opacity: 1;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .page {
                padding:
                    25px 18px;
            }


            .header {
                gap: 20px;

                align-items:
                    flex-start;
            }


            .title {
                font-size: 17px;
            }


            .subtitle {
                font-size: 10px;
            }


            .status {
                font-size: 9px;
            }


            .terminal {
                font-size: 11px;
            }


            .file {
                grid-template-columns:
                    1fr
                    auto
                    60px;
            }


            .file-subject {
                font-size: 15px;
            }


            .file-meta {
                font-size: 10px;
            }


            .file-photo {
                width: 55px;

                height: 68px;

                font-size: 8px;
            }


            .file-status {
                font-size: 9px;
            }


            .footer {
                flex-direction:
                    column;

                gap: 8px;
            }

        }


        @media (max-width: 500px) {

            .file {
                grid-template-columns:
                    1fr
                    60px;
            }


            .file-status {
                grid-column: 1;

                grid-row: 2;
            }


            .file-photo {
                grid-column: 2;

                grid-row:
                    1 / span 2;
            }

        }

    </style>

</head>


<body>

    <main class="page">


        <!-- =========================
             HEADER
        ========================= -->

        <header class="header">

            <div>

                <a
                    href="home.html"
                    class="title"
                >
                    CIGA SYSTEMS
                </a>


                <div class="subtitle">
                    PERSONNEL DATABASE // INTERNAL
                </div>

            </div>


            <div class="status">

                DATABASE: ONLINE<br>

                ACCESS: AUTHORIZED

            </div>

        </header>


        <!-- =========================
             TERMINAL
        ========================= -->

        <section class="terminal">

            <div>
                &gt; ACCESSING PERSONNEL ARCHIVE...
            </div>


            <div>
                &gt; INDEXING ACTIVE RECORDS...
            </div>


            <div id="recordCount">
                &gt; SCANNING RECORDS...
            </div>

        </section>


        <!-- =========================
             DIRECTORY
        ========================= -->

        <section class="directory">


            <div class="directory-title">

                // PERSONNEL DIRECTORY

            </div>


            <div id="personnelList">

                <div class="database-message">

                    &gt; LOADING PERSONNEL DATABASE...

                </div>

            </div>


        </section>


        <a
            href="home.html"
            class="back"
        >

            &lt;&lt; RETURN TO SYSTEM

        </a>


        <footer class="footer">

            <span>

                CIGA SYSTEMS // PERSONNEL DATABASE

            </span>


            <span>

                ALL ACCESS IS LOGGED

            </span>

        </footer>


    </main>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script>

        /* ==========================================
           SUPABASE VALUES
        ========================================== */

        const SUPABASE_URL =
            "https://ryefnjxwyjpeuwyoqbil.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_w25FJ3VA6LGLRVwzy7ZHgw_9Ll_3zPt";


        /* ==========================================
           CREATE SUPABASE CLIENT
        ========================================== */

        const {
            createClient
        } = supabase;


        const db =
            createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==========================================
           LOAD PERSONNEL
        ========================================== */

        async function loadPersonnel() {

            const personnelList =
                document.getElementById(
                    "personnelList"
                );


            const recordCount =
                document.getElementById(
                    "recordCount"
                );


            const {
                data,
                error
            } =
                await db

                    .from(
                        "personnel"
                    )

                    .select("*")

                    .eq(
                        "visible",
                        true
                    )

                    .order(
                        "id",
                        {
                            ascending: true
                        }
                    );


            /* ======================================
               DATABASE ERROR
            ====================================== */

            if (error) {

                console.error(
                    "DATABASE ERROR:",
                    error
                );


                recordCount.textContent =
                    "> DATABASE CONNECTION ERROR.";


                personnelList.innerHTML = `

                    <div class="database-message">

                        &gt; PERSONNEL DATABASE UNAVAILABLE.

                        <br>

                        &gt; CONNECTION ERROR.

                    </div>

                `;

                return;

            }


            /* ======================================
               RECORD COUNT
            ====================================== */

            recordCount.textContent =

                `> ${
                    String(
                        data.length
                    ).padStart(
                        2,
                        "0"
                    )
                } RECORDS FOUND.`;


            /* ======================================
               CLEAR LOADING MESSAGE
            ====================================== */

            personnelList.innerHTML =
                "";


            /* ======================================
               NO RECORDS
            ====================================== */

            if (
                data.length === 0
            ) {

                personnelList.innerHTML = `

                    <div class="database-message">

                        &gt; NO ACTIVE PERSONNEL RECORDS FOUND.

                    </div>

                `;

                return;

            }


            /* ======================================
               CREATE FILE CARDS
            ====================================== */

            data.forEach(
                person => {


                    const fileLink =
                        document.createElement(
                            "a"
                        );


                    fileLink.className =
                        "file-link";


                    /*
                        Universal file page.
                    */

                    fileLink.href =
                        `file.html?id=${person.id}`;


                    const fileNumber =
                        String(
                            person.file_number ||
                            person.id
                        ).padStart(
                            3,
                            "0"
                        );


                    const name =
                        String(
                            person.name ||
                            "UNKNOWN"
                        ).toUpperCase();


                    const status =
                        String(
                            person.status ||
                            "UNKNOWN"
                        ).toUpperCase();


                    const clearance =
                        String(
                            person.clearance ||
                            "UNKNOWN"
                        ).toUpperCase();


                    /*
                        Get this person's photo
                        from the Supabase photo field.
                    */

                    const photo =
                        person.photo &&
                        person.photo.trim() !== ""

                            ? person.photo

                            : "";


                    let photoHTML;


                    if (photo) {

                        photoHTML = `

                            <img
                                src="${photo}"
                                alt="${name}"
                                class="file-photo"
                            >

                        `;

                    } else {

                        photoHTML = `

                            <div class="file-photo">

                                IMAGE
                                <br>
                                UNAVAILABLE

                            </div>

                        `;

                    }


                    fileLink.innerHTML = `

                        <div class="file">


                            <div>


                                <div class="file-id">

                                    FILE_${fileNumber}

                                </div>


                                <div class="file-subject">

                                    [ ${name} ]

                                </div>


                                <div class="file-meta">

                                    STATUS:
                                    ${status}

                                    <br>

                                    CLEARANCE:
                                    ${clearance}

                                    <br>

                                    RECORD:
                                    AUTHORIZED

                                </div>


                            </div>


                            <div class="file-status">

                                AVAILABLE

                            </div>


                            ${photoHTML}


                        </div>

                    `;


                    personnelList.appendChild(
                        fileLink
                    );

                }
            );

        }


        /* ==========================================
           START
        ========================================== */

        loadPersonnel();

    </script>

</body>

</html>
