<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CIGA SYSTEMS // ADMINISTRATION</title>

    <link
        rel="icon"
        type="image/png"
        href="logo.png"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            background: #000;

            color: #fff;

            min-height: 100vh;

            font-family:
                "OCR A",
                "Courier New",
                monospace;
        }


        .screen {
            min-height: 100vh;

            display: flex;

            justify-content:
                center;

            align-items:
                center;

            padding: 25px;
        }


        .panel {
            width:
                min(
                    500px,
                    92vw
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.28
                );

            padding: 30px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.015
                );
        }


        /* =========================
           HEADER
        ========================= */

        .title {
            display: inline-block;

            font-size: 24px;

            letter-spacing: 4px;

            margin-bottom: 8px;

            color: #fff;

            text-decoration: none;

            cursor: pointer;

            transition:
                text-shadow 0.2s ease;
        }


        .title:hover {
            text-decoration: none;

            text-shadow:
                0 0 6px rgba(255,255,255,0.8),
                0 0 15px rgba(255,255,255,0.35);
        }


        .subtitle {
            font-size: 11px;

            letter-spacing: 2px;

            opacity: 0.55;

            margin-bottom: 30px;
        }


        /* =========================
           TERMINAL
        ========================= */

        .terminal {
            border-left:
                2px solid
                rgba(
                    255,
                    255,
                    255,
                    0.45
                );

            padding:
                15px 18px;

            margin-bottom: 25px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.02
                );

            font-size: 11px;

            line-height: 1.9;

            letter-spacing: 1px;

            opacity: 0.76;
        }


        /* =========================
           FORM
        ========================= */

        .field {
            margin-bottom: 18px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            font-size: 10px;

            letter-spacing: 2px;

            opacity: 0.55;
        }


        input {
            width: 100%;

            height: 44px;

            padding:
                0 13px;

            background: #000;

            color: #fff;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.22
                );

            outline: none;

            font-family: inherit;

            font-size: 12px;

            letter-spacing: 0.8px;
        }


        input::placeholder {
            color:
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );
        }


        input:focus {
            border-color:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.02
                );
        }


        /* =========================
           BUTTON
        ========================= */

        .button {
            width: 100%;

            height: 45px;

            margin-top: 8px;

            background: #000;

            color: #fff;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.4
                );

            font-family: inherit;

            font-size: 11px;

            letter-spacing: 2px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }


        .button:hover {
            background:
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    0.7
                );
        }


        .button:disabled {
            opacity: 0.45;

            cursor: not-allowed;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            margin-top: 18px;

            padding: 13px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            font-size: 10px;

            line-height: 1.8;

            letter-spacing: 1px;

            opacity: 0.75;

            display: none;
        }


        .message.visible {
            display: block;
        }


        /* =========================
           BACK
        ========================= */

        .back {
            display: block;

            margin-top: 20px;

            color: #fff;

            text-decoration: none;

            font-size: 9px;

            letter-spacing: 2px;

            opacity: 0.50;

            transition:
                opacity 0.2s ease;
        }


        .back:hover {
            opacity: 1;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .panel {
                padding: 24px;
            }


            .title {
                font-size: 19px;
            }


            .subtitle {
                font-size: 10px;
            }


            .terminal {
                font-size: 10px;
            }


            label {
                font-size: 9px;
            }


            input {
                font-size: 11px;
            }


            .button {
                font-size: 10px;
            }


            .message {
                font-size: 9px;
            }

        }

    </style>

</head>


<body>


<div class="screen">


    <section class="panel">


        <a
            href="home.html"
            class="title"
        >

            CIGA SYSTEMS

        </a>


        <div class="subtitle">

            ADMINISTRATION // RESTRICTED

        </div>


        <div class="terminal">

            &gt; SECURE ADMIN CHANNEL DETECTED.<br>

            &gt; AUTHENTICATION REQUIRED.<br>

            &gt; CLEARANCE VERIFICATION ENABLED.

        </div>


        <form id="loginForm">


            <div class="field">

                <label for="email">

                    ADMIN IDENTIFIER

                </label>


                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="field">

                <label for="password">

                    ACCESS CODE

                </label>


                <input
                    type="password"
                    id="password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="button"
                id="loginButton"
            >

                AUTHENTICATE

            </button>


        </form>


        <div
            id="message"
            class="message"
        ></div>


        <a
            href="home.html"
            class="back"
        >

            &lt;&lt; RETURN TO SYSTEM

        </a>


    </section>

</div>


<script>

    /* ==========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL =
        "https://ryefnjxwyjpeuwyoqbil.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_w25FJ3VA6LGLRVwzy7ZHgw_9Ll_3zPt";


    const {
        createClient
    } = supabase;


    /*
        Use the default persistent Supabase
        session so all tabs can share it.
    */

    const db =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {

                    persistSession:
                        true,

                    autoRefreshToken:
                        true,

                    detectSessionInUrl:
                        false

                }
            }
        );


    /* ==========================================
       ELEMENTS
    ========================================== */

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    /* ==========================================
       CHECK ADMIN SESSION
    ========================================== */

    async function checkExistingAdminSession() {

        try {

            const {
                data:
                sessionData,
                error:
                sessionError
            } =
                await db.auth.getSession();


            if (
                sessionError
                ||
                !sessionData.session
            ) {

                return false;

            }


            const userId =
                sessionData.session.user.id;


            const {
                data:
                adminData,
                error:
                adminError
            } =
                await db
                    .from(
                        "admins"
                    )
                    .select(
                        "user_id, role"
                    )
                    .eq(
                        "user_id",
                        userId
                    )
                    .eq(
                        "role",
                        "ADMIN"
                    )
                    .maybeSingle();


            if (
                adminError
                ||
                !adminData
            ) {

                /*
                    Session exists, but the user
                    is not an authorized admin.
                */

                return false;

            }


            return true;


        } catch (error) {

            console.error(
                "ADMIN SESSION CHECK ERROR:",
                error
            );


            return false;

        }

    }


    /* ==========================================
       REDIRECT AUTHENTICATED ADMIN
    ========================================== */

    async function initializeAdminPage() {

        const isAdmin =
            await checkExistingAdminSession();


        if (isAdmin) {

            /*
                The administrator is already
                authenticated.

                Skip the login screen entirely.
            */

            window.location.replace(
                "admin-panel.html"
            );

        }

    }


    /* ==========================================
       LOGIN
    ========================================== */

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            loginButton.disabled =
                true;


            loginButton.textContent =
                "AUTHENTICATING...";


            message.classList.remove(
                "visible"
            );


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            try {

                const {
                    data,
                    error
                } =
                    await db.auth.signInWithPassword({

                        email:
                            email,

                        password:
                            password

                    });


                if (
                    error
                    ||
                    !data.session
                ) {

                    console.error(
                        "AUTH ERROR:",
                        error
                    );


                    message.textContent =
                        "> AUTHENTICATION FAILED.";


                    message.classList.add(
                        "visible"
                    );


                    return;

                }


                /*
                    Verify that the authenticated
                    user is actually an ADMIN.
                */

                const userId =
                    data.session.user.id;


                const {
                    data:
                    adminData,
                    error:
                    adminError
                } =
                    await db
                        .from(
                            "admins"
                        )
                        .select(
                            "user_id, role"
                        )
                        .eq(
                            "user_id",
                            userId
                        )
                        .eq(
                            "role",
                            "ADMIN"
                        )
                        .maybeSingle();


                if (
                    adminError
                    ||
                    !adminData
                ) {

                    console.error(
                        "ADMIN CLEARANCE ERROR:",
                        adminError
                    );


                    await db.auth.signOut({
                        scope:
                            "local"
                    });


                    message.textContent =
                        "> ADMIN CLEARANCE NOT FOUND.";


                    message.classList.add(
                        "visible"
                    );


                    return;

                }


                /*
                    Authentication successful.
                */

                window.location.replace(
                    "admin-panel.html"
                );


            } catch (error) {

                console.error(
                    "ADMIN LOGIN ERROR:",
                    error
                );


                message.textContent =
                    "> AUTHENTICATION SYSTEM ERROR.";


                message.classList.add(
                    "visible"
                );

            } finally {

                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "AUTHENTICATE";

            }

        }
    );


    /* ==========================================
       START
    ========================================== */

    initializeAdminPage();

</script>


</body>

</html>
