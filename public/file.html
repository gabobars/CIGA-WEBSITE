<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CIGA SYSTEMS // FILE</title>
    <link
        rel="icon"
        type="image/png"
        href="logo.png"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: #fff;
            min-height: 100vh;

            font-family:
                "OCR A",
                "Courier New",
                monospace;

            overflow-x: hidden;
        }

        .page {
            width: 100%;
            min-height: 100vh;

            padding: 45px 60px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;

            padding-bottom: 18px;
            margin-bottom: 32px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.30);
        }

        .title {
            font-size: 25px;
            letter-spacing: 4px;
        }

        .subtitle {
            margin-top: 9px;

            font-size: 11px;

            letter-spacing: 2px;

            opacity: 0.50;
        }

        .header-status {
            text-align: right;

            font-size: 10px;
            line-height: 1.9;

            letter-spacing: 1.2px;

            opacity: 0.60;
        }


        /* =========================
           TERMINAL
        ========================= */

        .terminal {
            padding: 19px 22px;

            margin-bottom: 28px;

            border-left:
                2px solid
                rgba(255,255,255,0.50);

            background:
                rgba(255,255,255,0.025);

            font-size: 12px;
            line-height: 2;

            letter-spacing: 1px;

            opacity: 0.72;
        }


        /* =========================
           SUBJECT HEADER
        ========================= */

        .subject-header {
            display: grid;

            grid-template-columns:
                250px
                1fr
                220px;

            gap: 35px;

            padding: 30px;

            margin-bottom: 26px;

            border:
                1px solid
                rgba(255,255,255,0.28);

            background:
                rgba(255,255,255,0.02);
        }


        /* =========================
           PHOTO
        ========================= */

        .photo-area {
            border-right:
                1px solid
                rgba(255,255,255,0.16);

            padding-right: 30px;
        }

        .photo-label {
            font-size: 10px;
            letter-spacing: 2px;

            opacity: 0.45;

            margin-bottom: 14px;
        }

        .photo {
            width: 185px;
            height: 230px;

            display: block;

            object-fit: cover;

            border:
                1px solid
                rgba(255,255,255,0.42);

            background: #080808;

            filter: grayscale(100%);
        }

        .photo-caption {
            margin-top: 11px;

            font-size: 9px;
            letter-spacing: 1.5px;

            opacity: 0.40;
        }


        /* =========================
           SUBJECT
        ========================= */

        .subject-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .label {
            font-size: 10px;
            letter-spacing: 2px;

            opacity: 0.40;

            margin-bottom: 10px;
        }

        .subject-name {
            font-size: 34px;
            letter-spacing: 5px;

            margin-bottom: 20px;
        }

        .description {
            max-width: 720px;

            font-size: 14px;
            line-height: 2;

            letter-spacing: 0.8px;

            opacity: 0.76;
        }


        /* =========================
           CLASSIFICATION
        ========================= */

        .classification {
            text-align: right;
        }

        .classification-block {
            margin-bottom: 20px;
        }

        .classification-value {
            font-size: 13px;
            letter-spacing: 2px;
        }


        /* =========================
           GRID
        ========================= */

        .grid {
            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 22px;
        }


        /* =========================
           PANELS
        ========================= */

        .panel {
            padding: 28px;

            border:
                1px solid
                rgba(255,255,255,0.25);

            background:
                rgba(255,255,255,0.015);
        }

        .panel-title {
            font-size: 11px;
            letter-spacing: 3px;

            opacity: 0.52;

            padding-bottom: 12px;
            margin-bottom: 22px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.15);
        }


        /* =========================
           INFO
        ========================= */

        .info {
            display: grid;

            grid-template-columns:
                180px
                1fr;

            gap: 15px 22px;

            font-size: 12px;

            line-height: 1.7;
        }

        .info-label {
            opacity: 0.38;

            letter-spacing: 1.5px;
        }

        .info-value {
            opacity: 0.90;

            letter-spacing: 1px;
        }


        /* =========================
           INCIDENTS
        ========================= */

        .incident {
            padding: 16px;

            margin-bottom: 12px;

            border:
                1px solid
                rgba(255,255,255,0.17);

            background:
                rgba(255,255,255,0.02);
        }

        .incident-id {
            font-size: 10px;
            letter-spacing: 2px;

            opacity: 0.50;

            margin-bottom: 9px;
        }

        .incident-text {
            font-size: 12px;

            line-height: 1.85;

            opacity: 0.75;
        }


        /* =========================
           ASSOCIATED ARCHIVES
        ========================= */

        .archive-count {
            font-size: 9px;

            letter-spacing: 2px;

            opacity: 0.40;

            margin-bottom: 14px;
        }

        .archive-list {
            display: grid;

            gap: 10px;
        }

        .archive-link {
            display: block;

            color: #fff;

            text-decoration: none;
        }

        .archive-item {
            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap: 18px;

            padding: 15px;

            border:
                1px solid
                rgba(255,255,255,0.17);

            background:
                rgba(255,255,255,0.02);

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .archive-link:hover .archive-item {
            background:
                rgba(255,255,255,0.055);

            border-color:
                rgba(255,255,255,0.50);

            transform:
                translateX(4px);
        }

        .archive-item-number {
            font-size: 9px;

            letter-spacing: 2px;

            opacity: 0.40;

            margin-bottom: 7px;
        }

        .archive-item-title {
            font-size: 12px;

            letter-spacing: 1.8px;
        }

        .archive-item-date {
            font-size: 8px;

            letter-spacing: 1px;

            opacity: 0.35;

            text-align: right;
        }

        .archive-item-status {
            font-size: 8px;

            letter-spacing: 1.8px;

            opacity: 0.45;

            white-space: nowrap;
        }

        .archive-item-status::before {
            content: "";

            display: inline-block;

            width: 5px;
            height: 5px;

            margin-right: 7px;

            background: #fff;

            border-radius: 50%;
        }

        .archive-empty {
            padding: 15px;

            border:
                1px solid
                rgba(255,255,255,0.14);

            font-size: 9px;

            line-height: 1.8;

            letter-spacing: 1.5px;

            opacity: 0.40;
        }


        /* =========================
           OBSERVATION
        ========================= */

        .observation {
            font-size: 12px;

            line-height: 2;

            letter-spacing: 0.8px;

            opacity: 0.74;
        }


        /* =========================
           CONNECTIONS
        ========================= */

        .connections {
            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 12px;
        }

        .connection {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            min-height: 75px;

            padding: 14px;

            color: #fff;

            text-decoration: none;

            border:
                1px solid
                rgba(255,255,255,0.18);

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .connection:hover {
            background:
                rgba(255,255,255,0.06);

            border-color:
                rgba(255,255,255,0.60);

            transform: translateY(-2px);
        }

        .connection-name {
            font-size: 11px;

            letter-spacing: 2px;

            margin-bottom: 7px;
        }

        .connection-user {
            font-size: 10px;

            letter-spacing: 1px;

            opacity: 0.45;
        }


        /* =========================
           REDACTED
        ========================= */

        .redacted {
            display: inline-block;

            background: #fff;
            color: #000;

            padding: 2px 7px;

            font-size: 9px;

            letter-spacing: 1px;
        }


        /* =========================
           WARNING
        ========================= */

        .warning {
            margin-top: 18px;

            padding: 14px;

            border:
                1px solid
                rgba(255,255,255,0.18);

            background:
                rgba(255,255,255,0.025);

            font-size: 10px;

            line-height: 1.9;

            letter-spacing: 1.2px;

            opacity: 0.72;
        }


        /* =========================
           BACK
        ========================= */

        .back {
            display: inline-block;

            margin-top: 28px;

            color: #fff;

            text-decoration: none;

            font-size: 10px;

            letter-spacing: 2px;

            opacity: 0.48;
        }

        .back:hover {
            opacity: 1;
        }


        /* =========================
           ERROR / LOADING
        ========================= */

        .message {
            width: min(700px, 90vw);

            margin: 100px auto;

            padding: 25px;

            border:
                1px solid
                rgba(255,255,255,0.22);

            font-size: 12px;

            line-height: 2;

            letter-spacing: 1px;

            opacity: 0.65;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 950px) {

            .page {
                padding: 28px;
            }

            .subject-header {
                grid-template-columns:
                    210px
                    1fr;
            }

            .classification {
                grid-column:
                    1 / -1;

                display: grid;

                grid-template-columns:
                    repeat(4, 1fr);

                gap: 15px;

                padding-top: 20px;

                border-top:
                    1px solid
                    rgba(255,255,255,0.15);

                text-align: left;
            }

            .grid {
                grid-template-columns:
                    1fr;
            }
        }


        @media (max-width: 650px) {

            .page {
                padding: 18px;
            }

            .header {
                gap: 20px;

                align-items:
                    flex-start;
            }

            .title {
                font-size: 18px;
            }

            .header-status {
                font-size: 8px;
            }

            .subject-header {
                grid-template-columns:
                    1fr;
            }

            .photo-area {
                border-right: none;

                border-bottom:
                    1px solid
                    rgba(255,255,255,0.15);

                padding-right: 0;
                padding-bottom: 22px;
            }

            .classification {
                grid-template-columns:
                    1fr
                    1fr;
            }

            .subject-name {
                font-size: 23px;
            }

            .description,
            .observation,
            .incident-text {
                font-size: 11px;
            }

            .info {
                grid-template-columns:
                    1fr;

                gap: 4px;
            }

            .info-label {
                margin-top: 7px;
            }

            .connections {
                grid-template-columns:
                    1fr;
            }

            .archive-item {
                align-items:
                    flex-start;

                flex-direction:
                    column;
            }

            .archive-item-date {
                text-align: left;
            }

        }

    </style>

</head>


<body>

    <div id="app"></div>


    <script>

        /* ==========================================
           SUPABASE
        ========================================== */

        const SUPABASE_URL =
            "https://ryefnjxwyjpeuwyoqbil.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_w25FJ3VA6LGLRVwzy7ZHgw_9Ll_3zPt";


        const { createClient } =
            supabase;


        const db =
            createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const app =
            document.getElementById(
                "app"
            );


        /* ==========================================
           GET FILE ID
        ========================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const personId =
            params.get(
                "id"
            );


        /* ==========================================
           SOCIAL USERNAME
        ========================================== */

        function getUsername(
            url
        ) {

            if (
                !url ||
                url === "#"
            ) {

                return "UNAVAILABLE";

            }


            try {

                const parsedUrl =
                    new URL(url);


                let username =
                    parsedUrl.pathname
                        .split("/")
                        .filter(
                            Boolean
                        )
                        .pop();


                if (!username) {

                    return "UNAVAILABLE";

                }


                if (
                    username.startsWith("@")
                ) {

                    return username;

                }


                return "@" +
                    username;


            } catch (error) {

                return "EXTERNAL LINK";

            }

        }


        /* ==========================================
           SAFE VALUE
        ========================================== */

        function safe(
            value,
            fallback = "UNAVAILABLE"
        ) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {

                return fallback;

            }

            return String(value);

        }


        /* ==========================================
           REDACTED VALUE
        ========================================== */

        function redacted(
            value
        ) {

            const text =
                safe(value);


            if (
                text === "UNAVAILABLE" ||
                text === "UNDISCLOSED" ||
                text === "DATA INCOMPLETE"
            ) {

                return `

                    <span class="redacted">

                        ${text}

                    </span>

                `;

            }


            return text;

        }


        /* ==========================================
           LOAD ARCHIVES FOR PERSONNEL FILE
        ========================================== */

        async function loadAssociatedArchives(
            personId
        ) {

            const {
                data,
                error
            } =
                await db

                    .from(
                        "archives"
                    )

                    .select(
                        "id, archive_number, title, incident_date"
                    )

                    .eq(
                        "personnel_id",
                        personId
                    )

                    .eq(
                        "visible",
                        true
                    )

                    .order(
                        "id",
                        {
                            ascending: true
                        }
                    );


            if (error) {

                console.error(
                    "ARCHIVE DATABASE ERROR:",
                    error
                );


                return {

                    data: [],
                    error: error

                };

            }


            return {

                data:
                    data || [],

                error:
                    null

            };

        }


        /* ==========================================
           GET SOCIAL LINK
        ========================================== */

        function getSocialLink(
            value
        ) {

            if (
                !value ||
                value === "UNAVAILABLE"
            ) {

                return "#";

            }

            return value;

        }


        /* ==========================================
           LOAD FILE
        ========================================== */

        async function loadFile() {

            if (!personId) {

                showMessage(
                    "> INVALID FILE REQUEST.<br>" +
                    "> NO FILE IDENTIFIER PROVIDED."
                );

                return;

            }


            const {
                data,
                error
            } =
                await db

                    .from(
                        "personnel"
                    )

                    .select("*")

                    .eq(
                        "id",
                        personId
                    )

                    .eq(
                        "visible",
                        true
                    )

                    .single();


            if (
                error ||
                !data
            ) {

                console.error(
                    "FILE DATABASE ERROR:",
                    error
                );


                showMessage(
                    "> FILE ACCESS ERROR.<br>" +
                    "> RECORD NOT FOUND OR ACCESS DENIED."
                );

                return;

            }


            const {
                data:
                associatedArchives,
                error:
                archiveError
            } =
                await loadAssociatedArchives(
                    personId
                );


            if (archiveError) {

                console.warn(
                    "ASSOCIATED ARCHIVES ERROR:",
                    archiveError
                );

            }


            renderFile(
                data,
                associatedArchives
            );

        }


        /* ==========================================
           MESSAGE
        ========================================== */

        function showMessage(
            text
        ) {

            app.innerHTML = `

                <div class="message">

                    ${text}

                    <br><br>

                    <a
                        href="personnel.html"
                        class="back"
                    >
                        &lt;&lt; RETURN TO PERSONNEL DATABASE
                    </a>

                </div>

            `;

        }


        /* ==========================================
           RENDER FILE
        ========================================== */

        function renderFile(
            person,
            associatedArchives
        ) {

            const fileNumber =
                String(
                    person.file_number ||
                    person.id
                ).padStart(
                    3,
                    "0"
                );


            const name =
                safe(
                    person.name,
                    "UNKNOWN"
                ).toUpperCase();


            const alias =
                safe(
                    person.alias,
                    "UNKNOWN"
                ).toUpperCase();


            const status =
                safe(
                    person.status
                ).toUpperCase();


            const clearance =
                safe(
                    person.clearance
                ).toUpperCase();


            const observation =
                safe(
                    person.observation
                ).toUpperCase();


            const threat =
                safe(
                    person.threat_level
                ).toUpperCase();


            const description =
                safe(
                    person.description,
                    "NO DESCRIPTION AVAILABLE."
                );


            const primaryActivity =
                safe(
                    person.primary_activity
                ).toUpperCase();


            const location =
                safe(
                    person.location
                ).toUpperCase();


            const affiliation =
                safe(
                    person.affiliation
                ).toUpperCase();


            const origin =
                safe(
                    person.origin
                ).toUpperCase();


            const twitch =
                safe(
                    person.twitch,
                    "#"
                );


            const youtube =
                safe(
                    person.youtube,
                    "#"
                );


            const tiktok =
                safe(
                    person.tiktok,
                    "#"
                );


            const discord =
                safe(
                    person.discord,
                    "#"
                );


            /* =========================
               SOCIAL USERNAMES
            ========================= */

            const twitchUser =
                getUsername(
                    twitch
                );


            const youtubeUser =
                getUsername(
                    youtube
                );


            const tiktokUser =
                getUsername(
                    tiktok
                );


            /* =========================
               PHOTO
            ========================= */

            const photo =
                person.photo &&
                person.photo.trim() !== ""
                    ? person.photo
                    : "";


            /* =========================
               ASSOCIATED ARCHIVES
            ========================= */

            const archiveCount =
                associatedArchives.length;


            let associatedArchivesHTML;


            if (
                archiveCount === 0
            ) {

                associatedArchivesHTML = `

                    <div class="archive-empty">

                        &gt; NO ASSOCIATED ARCHIVES FOUND.

                    </div>

                `;

            } else {

                associatedArchivesHTML = `

                    <div class="archive-count">

                        ${String(
                            archiveCount
                        ).padStart(
                            2,
                            "0"
                        )} RECORDS FOUND.

                    </div>


                    <div class="archive-list">

                        ${
                            associatedArchives
                                .map(
                                    archive => `

                                        <a
                                            href="archive.html?id=${encodeURIComponent(
                                                archive.id
                                            )}"
                                            class="archive-link"
                                        >

                                            <div
                                                class="archive-item"
                                            >

                                                <div>

                                                    <div
                                                        class="archive-item-number"
                                                    >

                                                        ${safe(
                                                            archive.archive_number,
                                                            "ARCHIVE-UNKNOWN"
                                                        )}

                                                    </div>


                                                    <div
                                                        class="archive-item-title"
                                                    >

                                                        ${
                                                            safe(
                                                                archive.title,
                                                                "UNTITLED ARCHIVE"
                                                            ).toUpperCase()
                                                        }

                                                    </div>


                                                    ${
                                                        archive.incident_date
                                                            ? `
                                                                <div
                                                                    class="archive-item-date"
                                                                >

                                                                    INCIDENT:
                                                                    ${safe(
                                                                        archive.incident_date
                                                                    )}

                                                                </div>
                                                            `
                                                            : ""
                                                    }

                                                </div>


                                                <div
                                                    class="archive-item-status"
                                                >

                                                    ACCESS AVAILABLE

                                                </div>

                                            </div>

                                        </a>

                                    `
                                )
                                .join("")
                        }

                    </div>

                `;

            }


            document.title =
                `CIGA SYSTEMS // FILE_${fileNumber}`;


            /* =========================
               PAGE
            ========================= */

            app.innerHTML = `

                <main class="page">


                    <!-- HEADER -->

                    <header class="header">

                        <div>

                            <div class="title">
                                CIGA SYSTEMS
                            </div>

                            <div class="subtitle">
                                ENTITY RECORD // INTERNAL
                            </div>

                        </div>

                        <div class="header-status">

                            RECORD: FILE_${fileNumber}<br>
                            STATUS: ${status}

                        </div>

                    </header>


                    <!-- TERMINAL -->

                    <section class="terminal">

                        <div>
                            &gt; OPENING ENTITY RECORD...
                        </div>

                        <div>
                            &gt; SUBJECT IDENTIFIED:
                            ${name}
                        </div>

                        <div>
                            &gt; RECORD STATUS:
                            ${status}
                        </div>

                        <div>
                            &gt; OBSERVATION PROTOCOL:
                            ${observation}
                        </div>

                    </section>


                    <!-- SUBJECT HEADER -->

                    <section class="subject-header">


                        <!-- PHOTO -->

                        <div class="photo-area">

                            <div class="photo-label">
                                IDENTIFICATION IMAGE
                            </div>


                            ${
                                photo

                                    ? `

                                        <img
                                            src="${photo}"
                                            alt="${name}"
                                            class="photo"
                                        >

                                    `

                                    : `

                                        <div
                                            class="photo"
                                            style="
                                                display:flex;
                                                align-items:center;
                                                justify-content:center;
                                                text-align:center;
                                                font-size:10px;
                                                letter-spacing:2px;
                                                opacity:0.4;
                                            "
                                        >

                                            IMAGE<br>
                                            UNAVAILABLE

                                        </div>

                                    `
                            }


                            <div class="photo-caption">

                                SUBJECT // VISUAL RECORD

                            </div>

                        </div>


                        <!-- SUBJECT -->

                        <div class="subject-info">

                            <div class="label">
                                DESIGNATION
                            </div>

                            <div class="subject-name">

                                ${name}

                            </div>

                            <div class="description">

                                ${description}

                            </div>

                        </div>


                        <!-- CLASSIFICATION -->

                        <div class="classification">


                            <div class="classification-block">

                                <div class="label">
                                    STATUS
                                </div>

                                <div class="classification-value">

                                    ${status}

                                </div>

                            </div>


                            <div class="classification-block">

                                <div class="label">
                                    CLEARANCE
                                </div>

                                <div class="classification-value">

                                    ${clearance}

                                </div>

                            </div>


                            <div class="classification-block">

                                <div class="label">
                                    OBSERVATION
                                </div>

                                <div class="classification-value">

                                    ${observation}
