<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CIGA SYSTEMS // COMMUNICATIONS</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: #fff;

            min-height: 100vh;

            font-family:
                "OCR A",
                "Courier New",
                monospace;

            overflow: hidden;
        }


        /* =========================
           SCREEN
        ========================= */

        .screen {
            width: 100vw;
            height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            position: relative;
        }


        /* =========================
           COMMUNICATION BOX
        ========================= */

        .communication {
            width: min(700px, 85vw);

            position: relative;

            opacity: 1;
        }


        .title {
            font-size: 22px;

            letter-spacing: 4px;

            margin-bottom: 8px;
        }


        .subtitle {
            font-size: 10px;

            letter-spacing: 2px;

            opacity: 0.4;

            margin-bottom: 35px;
        }


        /* =========================
           TERMINAL
        ========================= */

        .terminal {
            padding: 22px 24px;

            border-left:
                2px solid
                rgba(255,255,255,0.5);

            background:
                rgba(255,255,255,0.02);

            font-size: 14px;

            line-height: 2;

            letter-spacing: 1px;

            min-height: 190px;
        }


        .line {
            opacity: 0;

            transition:
                opacity 0.35s ease;
        }


        .line.show {
            opacity: 1;
        }


        .cursor {
            display: inline-block;

            width: 8px;
            height: 16px;

            background: #fff;

            margin-left: 5px;

            vertical-align: middle;

            animation: blink 0.8s infinite;
        }


        @keyframes blink {

            0%, 45% {
                opacity: 1;
            }

            46%, 100% {
                opacity: 0;
            }

        }


        /* =========================
           DISCORD STATUS
        ========================= */

        .discord {
            margin-top: 25px;

            padding: 18px 20px;

            border:
                1px solid
                rgba(255,255,255,0.25);

            background:
                rgba(255,255,255,0.015);

            opacity: 0;

            transform:
                translateY(10px);

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }


        .discord.visible {
            opacity: 1;

            transform:
                translateY(0);
        }


        .discord-label {
            font-size: 9px;

            letter-spacing: 2px;

            opacity: 0.4;

            margin-bottom: 8px;
        }


        .discord-name {
            font-size: 14px;

            letter-spacing: 2px;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            position: absolute;

            bottom: 25px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 85vw;

            display: flex;

            justify-content:
                space-between;

            padding-top: 12px;

            border-top:
                1px solid
                rgba(255,255,255,0.18);

            font-size: 8px;

            letter-spacing: 2px;

            opacity: 0.3;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .communication {
                width: 88vw;
            }

            .title {
                font-size: 17px;
            }

            .terminal {
                font-size: 11px;
            }

            .footer {
                flex-direction: column;

                gap: 8px;
            }

        }

    </style>

</head>


<body>


<div class="screen">


    <main class="communication">


        <div class="title">
            CIGA SYSTEMS
        </div>


        <div class="subtitle">
            COMMUNICATION NETWORK // SECURE
        </div>


        <section class="terminal">


            <div
                class="line"
                id="line1"
            >
                &gt; INITIALIZING COMMUNICATION CHANNEL...
            </div>


            <div
                class="line"
                id="line2"
            >
                &gt; SCANNING NETWORK...
            </div>


            <div
                class="line"
                id="line3"
            >
                &gt; SECURE CHANNEL LOCATED.
            </div>


            <div
                class="line"
                id="line4"
            >
                &gt; VERIFYING CONNECTION...
            </div>


            <div
                class="line"
                id="line5"
            >
                &gt; CONNECTION VERIFIED.
            </div>


            <div
                class="line"
                id="line6"
            >
                &gt; ESTABLISHING EXTERNAL LINK...
                <span class="cursor"></span>
            </div>


        </section>


        <section
            class="discord"
            id="discord"
        >

            <div class="discord-label">
                DESTINATION
            </div>

            <div class="discord-name">
                DISCORD // GABOBARS
            </div>

        </section>


    </main>


    <footer class="footer">

        <span>
            CIGA SYSTEMS // COMMUNICATIONS
        </span>

        <span>
            CONNECTION MONITORED
        </span>

    </footer>


</div>


<script>

    const lines = [

        document.getElementById("line1"),
        document.getElementById("line2"),
        document.getElementById("line3"),
        document.getElementById("line4"),
        document.getElementById("line5"),
        document.getElementById("line6")

    ];


    const discord =
        document.getElementById("discord");


    function wait(milliseconds) {

        return new Promise(resolve => {

            setTimeout(resolve, milliseconds);

        });

    }


    async function startConnection() {

        await wait(400);

        lines[0].classList.add("show");

        await wait(600);

        lines[1].classList.add("show");

        await wait(700);

        lines[2].classList.add("show");

        await wait(700);

        lines[3].classList.add("show");

        await wait(700);

        lines[4].classList.add("show");

        await wait(700);

        lines[5].classList.add("show");

        await wait(1000);

        discord.classList.add("visible");

        await wait(1200);

        window.location.href =
            "https://discord.gg/GrqEaJrfXu";

    }


    startConnection();

</script>


</body>

</html>
