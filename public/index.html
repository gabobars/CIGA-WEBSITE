<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CIGA SYSTEMS</title>
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;

            background: #000;
            color: #fff;

            font-family: "OCR A", "Courier New", monospace;
        }

        .screen {
            width: 100%;
            height: 100vh;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           INITIAL SCREEN
        ========================= */

        .welcome {
            position: absolute;

            top: 16%;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            flex-direction: column;
            align-items: center;

            transition:
                top 1.2s ease,
                opacity 0.8s ease;
        }

        .logo {
            width: 240px;
            max-width: 60vw;

            display: block;

            user-select: none;
        }


        /* =========================
           ACCESS BUTTON
        ========================= */

        .access-button {
            margin-top: 35px;

            padding: 0;

            background: transparent;
            border: none;

            color: white;

            font-family: "OCR A", "Courier New", monospace;

            font-size: 16px;
            letter-spacing: 2px;

            cursor: pointer;

            display: block;

            position: relative;
            z-index: 10;

            transition:
                text-shadow 0.3s ease,
                opacity 0.3s ease;
        }

        .access-button:hover {
            text-shadow:
                0 0 6px rgba(255,255,255,0.8),
                0 0 15px rgba(255,255,255,0.4);
        }

        .access-button:disabled {
            cursor: default;
        }

        .access-button::before {
            content: "[ ";
        }

        .access-button::after {
            content: " ]";
        }


        /* =========================
           ACCESS RESPONSE
        ========================= */

        .access-response {
            margin-top: 16px;

            font-size: 12px;
            letter-spacing: 1.5px;

            opacity: 0;
            height: 18px;

            transition:
                opacity 0.3s ease;
        }

        .access-response.show {
            opacity: 0.7;
        }


        /* =========================
           BOOT SCREEN
        ========================= */

        .boot {
            position: absolute;

            top: 13%;
            left: 50%;

            transform: translateX(-50%);

            width: min(760px, 85vw);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        .boot.active {
            opacity: 1;
            visibility: visible;
        }

        .boot-logo {
            width: 120px;

            margin: 0 auto 35px auto;

            display: block;
        }


        /* =========================
           NODE INFORMATION
        ========================= */

        .node-info {
            margin-bottom: 35px;

            font-size: 9px;
            line-height: 1.8;

            letter-spacing: 1.5px;

            opacity: 0.35;

            text-align: right;
        }


        /* =========================
           TERMINAL LINES
        ========================= */

        .line {
            opacity: 0;

            margin-bottom: 13px;

            font-size: 16px;
            line-height: 1.5;
            letter-spacing: 1.5px;

            transition:
                opacity 0.3s ease;
        }

        .line.show {
            opacity: 1;
        }

        .line-status {
            opacity: 0.4;

            margin-left: 12px;

            font-size: 12px;
            letter-spacing: 1px;
        }

        .success {
            margin-top: 25px;
        }


        /* =========================
           CURSOR
        ========================= */

        .cursor {
            display: inline-block;

            width: 8px;
            height: 17px;

            margin-left: 5px;

            background: #fff;

            vertical-align: middle;

            animation: blink 0.8s infinite;
        }

        @keyframes blink {

            0%, 45% {
                opacity: 1;
            }

            46%, 100% {
                opacity: 0;
            }

        }


        /* =========================
           INITIAL SCREEN DISAPPEAR
        ========================= */

        .welcome.hidden {
            top: 7%;
            opacity: 0;

            pointer-events: none;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .logo {
                width: 180px;
            }

            .access-button {
                font-size: 13px;
            }

            .access-response {
                font-size: 9px;
            }

            .boot {
                width: 85vw;
                top: 10%;
            }

            .line {
                font-size: 11px;
                letter-spacing: 1px;
            }

            .line-status {
                font-size: 8px;
                margin-left: 8px;
            }

            .boot-logo {
                width: 90px;

                margin-bottom: 25px;
            }

            .node-info {
                font-size: 7px;
            }

            .cursor {
                width: 6px;
                height: 12px;
            }

        }

    </style>
</head>


<body>

    <main class="screen">


        <!-- =========================
             INITIAL SCREEN
        ========================= -->

        <div
            class="welcome"
            id="welcome"
        >

            <img
                src="logo.png"
                alt="CIGA"
                class="logo"
            >


            <button
                id="accessButton"
                class="access-button"
                type="button"
            >
                REQUEST ACCESS
            </button>


            <div
                class="access-response"
                id="accessResponse"
            >
                &gt; ACCESS REQUEST RECEIVED.
            </div>

        </div>


        <!-- =========================
             BOOT SEQUENCE
        ========================= -->

        <div
            class="boot"
            id="boot"
        >

            <img
                src="logo.png"
                alt="CIGA"
                class="boot-logo"
            >


            <!-- NODE INFORMATION -->

            <div class="node-info">

                NODE:
                <span id="nodeId">
                    CIGA-0000
                </span>

                <br>

                SESSION: ACTIVE

            </div>


            <!-- TERMINAL -->

            <div
                class="line"
                id="line1"
            >
                &gt; INITIALIZING CIGA SYSTEM...
            </div>


            <div
                class="line"
                id="line2"
            >

                &gt; VERIFYING CLEARANCE...

                <span class="line-status">
                    [ OK ]
                </span>

            </div>


            <div
                class="line"
                id="line3"
            >
                &gt; CLEARANCE VERIFIED.
            </div>


            <div
                class="line"
                id="line4"
            >
                &gt; REQUESTING ACCESS...
            </div>


            <div
                class="line"
                id="line5"
            >

                &gt; ESTABLISHING SECURE CONNECTION...

                <span class="line-status">
                    [ SUCCESS ]
                </span>

            </div>


            <div
                class="line"
                id="line6"
            >

                &gt; AUTHENTICATING OPERATOR...

                <span class="line-status">
                    [ OK ]
                </span>

            </div>


            <div
                class="line"
                id="line7"
            >
                &gt; ACCESS PROTOCOL ACCEPTED.
            </div>


            <div
                class="line success"
                id="line8"
            >

                &gt; ACCESS GRANTED.

                <span id="activeCursor"></span>

            </div>

        </div>

    </main>


    <script>

        /* =========================
           ELEMENTS
        ========================= */

        const accessButton =
            document.getElementById(
                "accessButton"
            );


        const accessResponse =
            document.getElementById(
                "accessResponse"
            );


        const welcome =
            document.getElementById(
                "welcome"
            );


        const boot =
            document.getElementById(
                "boot"
            );


        const nodeId =
            document.getElementById(
                "nodeId"
            );


        const lines = [

            document.getElementById("line1"),
            document.getElementById("line2"),
            document.getElementById("line3"),
            document.getElementById("line4"),
            document.getElementById("line5"),
            document.getElementById("line6"),
            document.getElementById("line7"),
            document.getElementById("line8")

        ];


        /* =========================
           GENERATE NODE
        ========================= */

        function generateNode() {

            const characters =
                "0123456789ABCDEF";

            let value = "";

            for (
                let i = 0;
                i < 4;
                i++
            ) {

                value +=
                    characters.charAt(
                        Math.floor(
                            Math.random() *
                            characters.length
                        )
                    );

            }

            return "CIGA-" + value;
        }


        /* =========================
           GET / CREATE NODE
        ========================= */

        let savedNode =
            localStorage.getItem(
                "ciga_node_id"
            );


        if (!savedNode) {

            savedNode =
                generateNode();

            localStorage.setItem(
                "ciga_node_id",
                savedNode
            );

        }


        nodeId.textContent =
            savedNode;


        /* =========================
           ACCESS REQUEST
        ========================= */

        accessButton.addEventListener(
            "click",
            async function () {

                /*
                    Prevent multiple clicks.
                */

                accessButton.disabled =
                    true;


                /*
                    Show the response
                    underneath the button.
                */

                accessResponse.classList.add(
                    "show"
                );


                /*
                    Give the response
                    a small amount of time
                    to be visible.
                */

                await wait(700);


                /*
                    Hide the initial screen.
                */

                welcome.classList.add(
                    "hidden"
                );


                /*
                    Show boot sequence.
                */

                boot.classList.add(
                    "active"
                );


                /*
                    Lines appear naturally
                    one at a time.
                */

                await wait(450);
                showLine(0);

                await wait(700);
                showLine(1);

                await wait(600);
                showLine(2);

                await wait(800);
                showLine(3);

                await wait(950);
                showLine(4);

                await wait(750);
                showLine(5);

                await wait(650);
                showLine(6);

                await wait(800);
                showLine(7);


                /*
                    Keep ACCESS GRANTED
                    visible briefly.
                */

                await wait(1700);


                /*
                    Enter main system.
                */

                window.location.href =
                    "home.html";

            }
        );


        /* =========================
           SHOW LINE
        ========================= */

        function showLine(index) {

            /*
                Remove cursors from
                previous lines.
            */

            lines.forEach(
                line => {

                    const oldCursor =
                        line.querySelector(
                            ".cursor"
                        );

                    if (oldCursor) {

                        oldCursor.remove();

                    }

                }
            );


            /*
                Show current line.
            */

            lines[index].classList.add(
                "show"
            );


            /*
                Add cursor to
                current line.
            */

            const cursor =
                document.createElement(
                    "span"
                );

            cursor.className =
                "cursor";


            lines[index].appendChild(
                cursor
            );

        }


        /* =========================
           WAIT
        ========================= */

        function wait(milliseconds) {

            return new Promise(
                resolve => {

                    setTimeout(
                        resolve,
                        milliseconds
                    );

                }
            );

        }

    </script>

</body>
</html>
